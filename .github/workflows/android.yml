name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm install

      - run: python3 build.py

      - run: npx cap sync android

      - name: Generar iconos
        run: |
          if [ -f assets/icon-only.png ]; then
            npx --yes @capacitor/assets generate --android --iconBackgroundColor '#150e1f' --iconBackgroundColorDark '#150e1f'
          else
            echo "No se encontró assets/icon-only.png"
          fi

      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: slow-shooter-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk